[project]
name = "burpweb"
version = "0.1.0"
description = "Replay a Burp Suite HTTP history export as an offline, browsable website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mitmproxy>=12.2"]

[project.scripts]
burpweb = "burpweb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burpweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
